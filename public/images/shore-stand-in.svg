<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 220" preserveAspectRatio="xMidYMax slice">
  <title>Stand-in shore</title>
  <desc>A drawn stand-in for a photograph: low black rocks and a grey headland at the edge of the ocean.</desc>
  <defs>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A1A7AC"/>
      <stop offset="1" stop-color="#B6BCC1"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B6167"/>
      <stop offset="1" stop-color="#70767C"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2124"/>
      <stop offset="1" stop-color="#2B2F33"/>
    </linearGradient>
  </defs>
  <!-- Far headland, light grey -->
  <path fill="url(#far)" d="M250 150 L340 128 L430 112 L520 96 L590 110 L700 126 L790 104 L900 86 L990 104 L1100 128 L1180 140 L1250 150 Z"/>
  <!-- Headland, mid grey -->
  <path fill="url(#mid)" d="M0 150 V92 L64 80 L120 66 L188 82 L260 98 L322 90 L380 84 L452 110 L520 134 L604 150 Z"/>
  <!-- Rocks, black stone -->
  <path fill="url(#near)" d="M636 150 L654 140 L668 134 L686 142 L704 150 Z"/>
  <path fill="url(#near)" d="M780 150 L822 128 L860 112 L896 120 L930 126 L972 102 L1010 84 L1070 96 L1130 104 L1176 84 L1220 66 L1276 82 L1330 96 L1388 74 L1440 58 V150 Z"/>
  <!-- Ocean -->
  <rect y="150" width="1440" height="70" fill="#3E4A55"/>
  <g stroke="#8A9096" stroke-opacity="0.55" stroke-width="1">
    <path d="M90 166.5 H470"/>
    <path d="M610 183.5 H1130"/>
    <path d="M980 200.5 H1300"/>
  </g>
</svg>
