<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMax slice">
  <title>Stand-in landscape</title>
  <desc>A drawn stand-in for a photograph: three ridges of stone over a band of ocean.</desc>
  <defs>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A1A7AC"/>
      <stop offset="1" stop-color="#B6BCC1"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B6167"/>
      <stop offset="1" stop-color="#70767C"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2124"/>
      <stop offset="1" stop-color="#2B2F33"/>
    </linearGradient>
  </defs>
  <!-- Far ridge, light grey -->
  <path fill="url(#far)" d="M0 119 L96 84 L155 62 L214 76 L302 92 L372 58 L408 50 L464 10 L512 34 L560 46 L619 78 L690 56 L776 31 L842 60 L900 96 L968 118 L1083 152 L1170 122 L1250 94 L1322 78 L1378 60 L1440 44 V420 H0 Z"/>
  <!-- Middle ridge, mid grey -->
  <path fill="url(#mid)" d="M0 192 L84 166 L138 158 L197 140 L262 156 L318 172 L380 181 L452 150 L498 138 L560 111 L618 134 L699 171 L770 152 L836 144 L914 125 L986 152 L1083 188 L1168 164 L1266 139 L1340 150 L1440 168 V420 H0 Z"/>
  <!-- Near ridge, black stone -->
  <path fill="url(#near)" d="M0 272 L92 254 L180 242 L250 250 L338 262 L420 240 L520 220 L600 232 L676 248 L759 262 L860 252 L998 242 L1090 256 L1202 272 L1300 262 L1440 249 V420 H0 Z"/>
  <!-- Ocean -->
  <rect y="329" width="1440" height="91" fill="#3E4A55"/>
  <g stroke="#8A9096" stroke-opacity="0.55" stroke-width="1">
    <path d="M120 344.5 H539"/>
    <path d="M699 361.5 H1222"/>
    <path d="M300 378.5 H599"/>
  </g>
</svg>
